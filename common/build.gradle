architectury {
    common rootProject.enabled_platforms.split(',')
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }

    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Ladysnake Libs"
        url = 'https://maven.ladysnake.org/releases'
    }

    maven {
        name ='OwO-Lib'
        url 'https://maven.wispforest.io'
    }

    maven { url = "https://maven.bawnorton.com/releases" }

    maven {
        name = 'Sponge'
        url = uri('https://repo.spongepowered.org/repository/maven-public')
    }
}

dependencies {
    // We depend on fabric loader here to use the fabric @Environment annotations and get the mixin dependencies
    // Do NOT use other classes from fabric loader
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'

    //GeckoLib Dependency
    implementation "software.bernie.geckolib:geckolib-common-${minecraft_version}:${project.geckolib_version}"
    implementation("com.eliotlash.mclib:mclib:20")

    //OwO-Lib Dependency
    // Arch Loom Projects - Neoforge
    // Don't worry about loading issues as it will only be present to get the arch interface injection and Access Widener
    annotationProcessor modImplementation("io.wispforest:owo-lib:${project.owo_version}")
}

loom {
//    accessWidenerPath = file("src/main/resources/witcher_medallions-common.accesswidener")

    mixin {
        defaultRefmapName.set("witcher_medallions-common-refmap.json")
    }

    runs {
        // This adds a new gradle task that runs the datagen API: "gradlew runDatagen"
        datagen {
            inherit server
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.modid=witcher_medallions"

            runDir "build/datagen"
        }
    }
}

File generatedResourcesDir = file("src/main/generated/resources")
// Add the generated resources to the main source set
sourceSets {
    main {
        resources {
            srcDirs += [
                    generatedResourcesDir
            ]
        }
    }
}